name: Windows Build Baseline

on:
  workflow_dispatch:
  push:
    branches:
      - audit/windows-build-baseline

jobs:
  build:
    name: Restore and build Windows baseline
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Show .NET environment
        run: |
          dotnet --info
          dotnet --list-sdks
          dotnet --list-runtimes

      - name: Restore Core
        run: dotnet restore VPet-Simulator.Core/VPet-Simulator.Core.csproj -p:EnableWindowsTargeting=true

      - name: Restore Interface
        run: dotnet restore VPet-Simulator.Windows.Interface/VPet-Simulator.Windows.Interface.csproj -p:EnableWindowsTargeting=true

      - name: Restore Windows
        run: dotnet restore VPet-Simulator.Windows/VPet-Simulator.Windows.csproj -p:EnableWindowsTargeting=true

      - name: Build Core
        run: dotnet build VPet-Simulator.Core/VPet-Simulator.Core.csproj -c Release --no-restore -p:EnableWindowsTargeting=true -v:normal

      - name: Build Interface
        run: dotnet build VPet-Simulator.Windows.Interface/VPet-Simulator.Windows.Interface.csproj -c Release --no-restore -p:EnableWindowsTargeting=true -v:normal

      - name: Build Windows
        id: build-windows
        shell: pwsh
        run: |
          $logPath = "windows-build.log"
          $binlogPath = "windows-build.binlog"
          $stdoutPath = "windows-build.stdout.log"
          $stderrPath = "windows-build.stderr.log"

          Remove-Item -Path $logPath, $binlogPath, $stdoutPath, $stderrPath -Force -ErrorAction SilentlyContinue
          New-Item -Path $logPath -ItemType File -Force | Out-Null

          $arguments = @(
            "build",
            "VPet-Simulator.Windows/VPet-Simulator.Windows.csproj",
            "-c",
            "Release",
            "--no-restore",
            "-p:EnableWindowsTargeting=true",
            "-v:diag",
            "-bl:$binlogPath"
          )

          $process = Start-Process `
            -FilePath "dotnet" `
            -ArgumentList $arguments `
            -NoNewWindow `
            -Wait `
            -PassThru `
            -RedirectStandardOutput $stdoutPath `
            -RedirectStandardError $stderrPath

          $exitCode = $process.ExitCode
          "exit_code=$exitCode" >> $env:GITHUB_OUTPUT

          if (Test-Path $stdoutPath) {
            Get-Content -Path $stdoutPath | Add-Content -Path $logPath
          }
          if (Test-Path $stderrPath) {
            Add-Content -Path $logPath -Value ""
            Add-Content -Path $logPath -Value "----- STDERR -----"
            Get-Content -Path $stderrPath | Add-Content -Path $logPath
          }

          Write-Host "dotnet build exit code: $exitCode"
          Write-Host "Last 300 lines from $logPath:"
          if (Test-Path $logPath) {
            Get-Content -Path $logPath -Tail 300
          } else {
            Write-Host "$logPath was not created."
          }

          exit 0

      - name: Upload Windows build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-build-diagnostics
          path: |
            windows-build.log
            windows-build.binlog
          if-no-files-found: warn
          retention-days: 7

      - name: Fail if Windows build failed
        if: always()
        shell: pwsh
        run: |
          $exitCode = "${{ steps.build-windows.outputs.exit_code }}"
          if ($exitCode -ne "0") {
            Write-Error "Build Windows failed with exit code $exitCode"
            exit 1
          }
