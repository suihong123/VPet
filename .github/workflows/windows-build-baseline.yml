name: Windows Build Baseline

on:
  workflow_dispatch:
  push:
    branches:
      - audit/windows-build-baseline

jobs:
  build:
    name: Restore and build Windows baseline
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Show .NET environment
        run: |
          dotnet --info
          dotnet --list-sdks
          dotnet --list-runtimes

      - name: Restore Core
        run: dotnet restore VPet-Simulator.Core/VPet-Simulator.Core.csproj -p:EnableWindowsTargeting=true

      - name: Restore Interface
        run: dotnet restore VPet-Simulator.Windows.Interface/VPet-Simulator.Windows.Interface.csproj -p:EnableWindowsTargeting=true

      - name: Restore Windows
        run: dotnet restore VPet-Simulator.Windows/VPet-Simulator.Windows.csproj -p:EnableWindowsTargeting=true -p:Platform=x64

      - name: Check Windows Steamworks assets
        shell: pwsh
        run: |
          $assetsPath = "VPet-Simulator.Windows/obj/project.assets.json"
          "Facepunch.Steamworks matches:"
          Select-String -Path $assetsPath -Pattern '"Facepunch\.Steamworks/'
          "Facepunch.Steamworks.win32 matches:"
          Select-String -Path $assetsPath -Pattern '"Facepunch\.Steamworks\.win32/'

      - name: Build Core
        run: dotnet build VPet-Simulator.Core/VPet-Simulator.Core.csproj -c Release --no-restore -p:EnableWindowsTargeting=true -v:normal

      - name: Build Interface
        run: dotnet build VPet-Simulator.Windows.Interface/VPet-Simulator.Windows.Interface.csproj -c Release --no-restore -p:EnableWindowsTargeting=true -v:normal

      - name: Build Windows
        id: build-windows
        shell: cmd
        run: |
          type nul > windows-build.log
          dotnet build VPet-Simulator.Windows/VPet-Simulator.Windows.csproj -c Release --no-restore -p:EnableWindowsTargeting=true -p:Platform=x64 -v:diag -bl:windows-build.binlog > windows-build.log 2>&1
          set EXIT_CODE=%ERRORLEVEL%
          echo exit_code=%EXIT_CODE%>> %GITHUB_OUTPUT%
          echo dotnet build exit code: %EXIT_CODE%
          echo Last 300 lines from windows-build.log:
          powershell -NoLogo -NoProfile -Command "Get-Content -Path 'windows-build.log' -Tail 300"
          exit /b 0

      - name: Upload Windows build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-build-diagnostics
          path: |
            windows-build.log
            windows-build.binlog
          if-no-files-found: warn
          retention-days: 7

      - name: Fail if Windows build failed
        if: always()
        shell: pwsh
        run: |
          $exitCode = "${{ steps.build-windows.outputs.exit_code }}"
          if ($exitCode -ne "0") {
            Write-Error "Build Windows failed with exit code $exitCode"
            exit 1
          }
