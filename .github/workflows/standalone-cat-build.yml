name: Standalone Cat Build

on:
  workflow_dispatch:
    inputs:
      upload_test_package:
        description: Upload internal Windows test package
        required: false
        default: false
        type: boolean
  push:
    branches:
      - feature/standalone-cat-mvp

jobs:
  verify-cat-resources:
    name: Verify placeholder cat resources
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Show .NET info
        shell: pwsh
        run: dotnet --info

      - name: Verify default cat configuration
        shell: pwsh
        run: |
          $runtimeFeatures = Get-Content "VPet-Simulator.Windows/RuntimeFeatures.cs" -Raw
          if ($runtimeFeatures -notmatch 'DefaultPetId\s*=>\s*"cat"') {
            Write-Error "RuntimeFeatures.DefaultPetId is not cat."
            exit 1
          }

          $catSourceConfig = Get-Content "VPet-Simulator.Windows/mod/0000_core/pet/cat.lps" -Raw
          if ($catSourceConfig -notmatch 'pet#cat:') {
            Write-Error "Source cat.lps does not declare pet#cat."
            exit 1
          }
          if ($catSourceConfig -notmatch 'path#cat:') {
            Write-Error "Source cat.lps does not declare path#cat."
            exit 1
          }

      - name: Restore Windows x64
        shell: pwsh
        run: dotnet restore VPet-Simulator.Windows/VPet-Simulator.Windows.csproj -p:Platform=x64 -p:EnableWindowsTargeting=true

      - name: Build Windows x64
        id: build-windows
        shell: pwsh
        run: |
          $logPath = "windows-build.log"
          $binlogPath = "windows-build.binlog"

          dotnet build VPet-Simulator.Windows/VPet-Simulator.Windows.csproj `
            -c Release `
            --no-restore `
            -p:Platform=x64 `
            -p:EnableWindowsTargeting=true `
            -v:diag `
            "-bl:$binlogPath" 2>&1 | Tee-Object -FilePath $logPath

          $buildExitCode = $LASTEXITCODE
          "exit_code=$buildExitCode" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

          Write-Host "dotnet build exit code: $buildExitCode"
          Write-Host "Last 300 lines:"
          Get-Content $logPath -Tail 300

          exit 0

      - name: Upload Windows build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: standalone-cat-build-diagnostics
          path: |
            windows-build.log
            windows-build.binlog
          if-no-files-found: warn
          retention-days: 7

      - name: Verify cat resources
        if: steps.build-windows.outputs.exit_code == '0'
        shell: pwsh
        run: |
          $outputRoots = @(
            "VPet-Simulator.Windows/bin/x64/Release/net8.0-windows",
            "VPet-Simulator.Windows/bin/Release/net8.0-windows"
          )
          $outputRoot = $outputRoots | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $outputRoot) {
            Write-Error "Could not find Windows build output directory."
            exit 1
          }

          $catRoot = Join-Path $outputRoot "mod/0000_core/pet/cat"
          $catConfig = Join-Path $outputRoot "mod/0000_core/pet/cat.lps"
          if (-not (Test-Path $catConfig)) {
            Write-Error "Missing cat.lps at $catConfig"
            exit 1
          }
          if (-not (Test-Path $catRoot)) {
            Write-Error "Missing cat resource directory at $catRoot"
            exit 1
          }
          $catConfigText = Get-Content $catConfig -Raw
          if ($catConfigText -notmatch 'pet#cat:') {
            Write-Error "Output cat.lps does not declare pet#cat."
            exit 1
          }
          if ($catConfigText -notmatch 'path#cat:') {
            Write-Error "Output cat.lps does not declare path#cat."
            exit 1
          }

          $pngFiles = Get-ChildItem $catRoot -Recurse -File -Filter *.png | Sort-Object FullName
          if ($pngFiles.Count -ne 12) {
            Write-Error "Expected 12 cat PNG files, found $($pngFiles.Count)."
            exit 1
          }

          $manifest = "cat-resource-manifest.txt"
          "output_root=$outputRoot" | Set-Content $manifest
          "cat_config=mod/0000_core/pet/cat.lps" | Add-Content $manifest
          "png_count=$($pngFiles.Count)" | Add-Content $manifest
          Get-Item $catConfig | ForEach-Object {
            "mod/0000_core/pet/cat.lps`t$($_.Length)" | Add-Content $manifest
          }
          $pngFiles | ForEach-Object {
            $relative = $_.FullName.Substring((Resolve-Path $outputRoot).Path.Length + 1).Replace('\', '/')
            "$relative`t$($_.Length)" | Add-Content $manifest
          }

          Get-Content $manifest

      - name: Upload cat resource manifest
        if: steps.build-windows.outputs.exit_code == '0'
        uses: actions/upload-artifact@v4
        with:
          name: cat-resource-manifest
          path: cat-resource-manifest.txt
          retention-days: 7

      - name: Prepare internal Windows test package
        if: github.event_name == 'workflow_dispatch' && inputs.upload_test_package == true && steps.build-windows.outputs.exit_code == '0'
        shell: pwsh
        run: |
          $outputRoots = @(
            "VPet-Simulator.Windows/bin/x64/Release/net8.0-windows",
            "VPet-Simulator.Windows/bin/Release/net8.0-windows"
          )
          $outputRoot = $outputRoots | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $outputRoot) {
            Write-Error "Could not find Windows build output directory."
            exit 1
          }

          $packageRoot = "standalone-cat-windows-x64-test"
          if (Test-Path $packageRoot) {
            Remove-Item $packageRoot -Recurse -Force
          }
          New-Item -ItemType Directory -Path $packageRoot | Out-Null

          Copy-Item -Path (Join-Path $outputRoot "*") -Destination $packageRoot -Recurse -Force
          Get-ChildItem $packageRoot -Recurse -Force -Include *.pdb,*.binlog | Remove-Item -Force

          @"
          Internal Windows Runtime Test Package
          =====================================

          This package is only for internal technical validation.
          It is not a formal release build.
          Do not sell, publish, promote, or redistribute this package.

          This package may still contain upstream project structure, original sample assets,
          and other resources that are not cleared for commercial distribution.

          Steam is disabled by runtime feature flags. Closing Steam before first launch is not required.

          Recommended test environment:
          - Windows 10/11 x64
          - .NET 8 Desktop Runtime installed

          If the app does not start and Windows reports a missing runtime, install the Microsoft
          .NET 8 Desktop Runtime for x64, then try again.

          Report startup errors with:
          - Windows version
          - whether .NET 8 Desktop Runtime is installed
          - whether Steam is installed/running
          - screenshots of any error dialogs
          - local logs from the application directory or user profile, if generated
          - Windows Event Viewer application error details, if present
          "@ | Set-Content -Path (Join-Path $packageRoot "INTERNAL-TEST-README.txt")

          Write-Host "Prepared package files:"
          Get-ChildItem $packageRoot -Recurse -File | Select-Object FullName, Length

      - name: Upload internal Windows test package
        if: github.event_name == 'workflow_dispatch' && inputs.upload_test_package == true && steps.build-windows.outputs.exit_code == '0'
        uses: actions/upload-artifact@v4
        with:
          name: standalone-cat-windows-x64-test
          path: standalone-cat-windows-x64-test
          retention-days: 3

      - name: Prepare lean internal Windows test package
        if: github.event_name == 'workflow_dispatch' && inputs.upload_test_package == true && steps.build-windows.outputs.exit_code == '0'
        shell: pwsh
        run: |
          $fullPackageRoot = "standalone-cat-windows-x64-test"
          $leanPackageRoot = "artifacts/standalone-cat-windows-x64-lean-test"
          $manifestPath = "standalone-cat-lean-manifest.txt"

          if (-not (Test-Path $fullPackageRoot -PathType Container)) {
            Write-Error "Full test package staging directory is missing: $fullPackageRoot"
            exit 1
          }

          $fullVupRoot = Join-Path $fullPackageRoot "mod/0000_core/pet/vup"
          $fullGalleryRoot = Join-Path $fullPackageRoot "mod/0000_core/file"
          if (-not (Test-Path $fullVupRoot -PathType Container)) {
            Write-Error "Full test package no longer contains the original vup resources."
            exit 1
          }
          if (-not (Test-Path $fullGalleryRoot -PathType Container)) {
            Write-Error "Full test package no longer contains the original gallery archives."
            exit 1
          }

          if (Test-Path $leanPackageRoot) {
            Remove-Item $leanPackageRoot -Recurse -Force
          }
          New-Item -ItemType Directory -Path $leanPackageRoot -Force | Out-Null
          Copy-Item -Path (Join-Path $fullPackageRoot "*") -Destination $leanPackageRoot -Recurse -Force

          $leanVupRoot = Join-Path $leanPackageRoot "mod/0000_core/pet/vup"
          $leanGalleryRoot = Join-Path $leanPackageRoot "mod/0000_core/file"
          Remove-Item $leanVupRoot -Recurse -Force
          Remove-Item $leanGalleryRoot -Recurse -Force

          if (-not (Test-Path $fullVupRoot -PathType Container) -or
              -not (Test-Path $fullGalleryRoot -PathType Container)) {
            Write-Error "Lean staging unexpectedly modified the full test package."
            exit 1
          }

          Copy-Item -Path "LICENSE" -Destination (Join-Path $leanPackageRoot "LICENSE") -Force

          $requiredFiles = @(
            "VPet-Simulator.Windows.exe",
            "VPet-Simulator.Windows.dll",
            "VPet-Simulator.Core.dll",
            "VPet-Simulator.Windows.Interface.dll",
            "mod/0000_core/info.lps",
            "mod/0000_core/pet/cat.lps",
            "LICENSE"
          )
          foreach ($requiredFile in $requiredFiles) {
            $requiredPath = Join-Path $leanPackageRoot $requiredFile
            if (-not (Test-Path $requiredPath -PathType Leaf)) {
              Write-Error "Lean package is missing required file: $requiredFile"
              exit 1
            }
          }

          $catRoot = Join-Path $leanPackageRoot "mod/0000_core/pet/cat"
          if (-not (Test-Path $catRoot -PathType Container)) {
            Write-Error "Lean package is missing the cat resource directory."
            exit 1
          }

          $catPngFiles = @(Get-ChildItem $catRoot -Recurse -File -Filter *.png)
          if ($catPngFiles.Count -ne 12) {
            Write-Error "Expected 12 cat PNG files in lean package, found $($catPngFiles.Count)."
            exit 1
          }

          if (Test-Path $leanVupRoot) {
            Write-Error "Lean package still contains mod/0000_core/pet/vup."
            exit 1
          }
          if (Test-Path $leanGalleryRoot) {
            Write-Error "Lean package still contains mod/0000_core/file."
            exit 1
          }
          $galleryArchives = @(Get-ChildItem (Join-Path $leanPackageRoot "mod/0000_core") -Recurse -File -Filter *.zlps |
            Where-Object { $_.FullName -match '[\\/]file[\\/]' })
          if ($galleryArchives.Count -ne 0) {
            Write-Error "Lean package still contains gallery .zlps archives."
            exit 1
          }

          function Get-PackageStats([string] $path) {
            $files = @(Get-ChildItem $path -Recurse -File -Force)
            $bytes = [long](($files | Measure-Object -Property Length -Sum).Sum)
            return [PSCustomObject]@{
              FileCount = $files.Count
              Bytes = $bytes
            }
          }

          $beforeStats = Get-PackageStats $fullPackageRoot
          $afterStats = Get-PackageStats $leanPackageRoot
          $reducedBytes = $beforeStats.Bytes - $afterStats.Bytes
          $reducedPercent = if ($beforeStats.Bytes -eq 0) { 0 } else { ($reducedBytes / $beforeStats.Bytes) * 100 }
          $catBytes = [long](($catPngFiles | Measure-Object -Property Length -Sum).Sum)
          $largestFiles = @(Get-ChildItem $leanPackageRoot -Recurse -File -Force |
            Sort-Object Length -Descending |
            Select-Object -First 30)
          $coreDirectories = @(Get-ChildItem (Join-Path $leanPackageRoot "mod/0000_core") -Directory |
            Sort-Object Name)

          @(
            "commit_sha=$env:GITHUB_SHA",
            "build_time_utc=$([DateTime]::UtcNow.ToString('o'))",
            "before_file_count=$($beforeStats.FileCount)",
            "after_file_count=$($afterStats.FileCount)",
            "before_total_bytes=$($beforeStats.Bytes)",
            "after_total_bytes=$($afterStats.Bytes)",
            "reduced_bytes=$reducedBytes",
            "reduced_percent=$($reducedPercent.ToString('F2'))",
            "excluded=mod/0000_core/pet/vup",
            "excluded=mod/0000_core/file",
            "cat_png_count=$($catPngFiles.Count)",
            "cat_png_total_bytes=$catBytes",
            "",
            "largest_30_files:"
          ) | Set-Content $manifestPath

          $leanRootPath = (Resolve-Path $leanPackageRoot).Path
          foreach ($file in $largestFiles) {
            $relativePath = $file.FullName.Substring($leanRootPath.Length + 1).Replace('\', '/')
            "$relativePath`t$($file.Length)" | Add-Content $manifestPath
          }

          "" | Add-Content $manifestPath
          "mod/0000_core_remaining_directories:" | Add-Content $manifestPath
          foreach ($directory in $coreDirectories) {
            "mod/0000_core/$($directory.Name)" | Add-Content $manifestPath
          }

          @"
          ## Standalone cat lean test package

          | Metric | Value |
          | --- | ---: |
          | Commit | $env:GITHUB_SHA |
          | Files before | $($beforeStats.FileCount) |
          | Files after | $($afterStats.FileCount) |
          | Bytes before | $($beforeStats.Bytes) |
          | Bytes after | $($afterStats.Bytes) |
          | Bytes removed | $reducedBytes |
          | Reduction | $($reducedPercent.ToString('F2'))% |
          | Cat PNG files | $($catPngFiles.Count) |
          | Cat PNG bytes | $catBytes |

          Excluded only:
          - mod/0000_core/pet/vup
          - mod/0000_core/file
          "@ | Add-Content $env:GITHUB_STEP_SUMMARY

          Get-Content $manifestPath

      - name: Upload lean internal Windows test package
        if: github.event_name == 'workflow_dispatch' && inputs.upload_test_package == true && steps.build-windows.outputs.exit_code == '0'
        uses: actions/upload-artifact@v4
        with:
          name: standalone-cat-windows-x64-lean-test
          path: artifacts/standalone-cat-windows-x64-lean-test
          retention-days: 3

      - name: Upload lean package manifest
        if: github.event_name == 'workflow_dispatch' && inputs.upload_test_package == true && steps.build-windows.outputs.exit_code == '0'
        uses: actions/upload-artifact@v4
        with:
          name: standalone-cat-lean-manifest
          path: standalone-cat-lean-manifest.txt
          retention-days: 7

      - name: Prepare x64-only lean v2 internal Windows test package
        if: github.event_name == 'workflow_dispatch' && inputs.upload_test_package == true && steps.build-windows.outputs.exit_code == '0'
        shell: pwsh
        run: |
          $fullPackageRoot = "standalone-cat-windows-x64-test"
          $leanV1Root = "artifacts/standalone-cat-windows-x64-lean-test"
          $leanV2Root = "artifacts/standalone-cat-windows-x64-lean-v2-test"
          $manifestPath = "standalone-cat-lean-v2-manifest.txt"

          function Get-PackageStats([string] $path) {
            $files = @(Get-ChildItem $path -Recurse -File -Force)
            $bytes = [long](($files | Measure-Object -Property Length -Sum).Sum)
            return [PSCustomObject]@{
              FileCount = $files.Count
              Bytes = $bytes
            }
          }

          function Get-PackageInventory([string] $path) {
            $rootPath = (Resolve-Path $path).Path
            $inventory = @{}
            foreach ($file in Get-ChildItem $path -Recurse -File -Force) {
              $relativePath = $file.FullName.Substring($rootPath.Length + 1).Replace('\', '/')
              $inventory[$relativePath] = [PSCustomObject]@{
                Length = [long]$file.Length
                Sha256 = (Get-FileHash $file.FullName -Algorithm SHA256).Hash
              }
            }
            return $inventory
          }

          if (-not (Test-Path $fullPackageRoot -PathType Container)) {
            Write-Error "Full test package staging directory is missing: $fullPackageRoot"
            exit 1
          }
          if (-not (Test-Path $leanV1Root -PathType Container)) {
            Write-Error "Lean v1 staging directory is missing: $leanV1Root"
            exit 1
          }

          $fullRequiredPaths = @(
            "mod/0000_core/pet/vup",
            "mod/0000_core/file",
            "runtimes/osx/native/libSkiaSharp.dylib",
            "runtimes/win-arm64/native/libSkiaSharp.dll",
            "runtimes/win-x86/native/libSkiaSharp.dll",
            "runtimes/win-x64/native/libSkiaSharp.dll"
          )
          foreach ($relativePath in $fullRequiredPaths) {
            if (-not (Test-Path (Join-Path $fullPackageRoot $relativePath))) {
              Write-Error "Full package regression check failed; missing: $relativePath"
              exit 1
            }
          }

          $leanV1RequiredFiles = @(
            "runtimes/osx/native/libSkiaSharp.dylib",
            "runtimes/win-arm64/native/libSkiaSharp.dll",
            "runtimes/win-x86/native/libSkiaSharp.dll",
            "runtimes/win-x64/native/libSkiaSharp.dll",
            "mod/0000_core/pet/cat.lps",
            "LICENSE"
          )
          foreach ($relativePath in $leanV1RequiredFiles) {
            if (-not (Test-Path (Join-Path $leanV1Root $relativePath) -PathType Leaf)) {
              Write-Error "Lean v1 regression check failed; missing: $relativePath"
              exit 1
            }
          }
          foreach ($relativePath in @("mod/0000_core/pet/vup", "mod/0000_core/file")) {
            if (Test-Path (Join-Path $leanV1Root $relativePath)) {
              Write-Error "Lean v1 regression check failed; excluded path exists: $relativePath"
              exit 1
            }
          }

          if (Test-Path $leanV2Root) {
            Remove-Item $leanV2Root -Recurse -Force
          }
          New-Item -ItemType Directory -Path $leanV2Root -Force | Out-Null
          Copy-Item -Path (Join-Path $leanV1Root "*") -Destination $leanV2Root -Recurse -Force

          $excludedRuntimeDirectories = @(
            "runtimes/osx",
            "runtimes/win-arm64",
            "runtimes/win-x86"
          )
          foreach ($relativePath in $excludedRuntimeDirectories) {
            $targetPath = Join-Path $leanV2Root $relativePath
            if (-not (Test-Path $targetPath -PathType Container)) {
              Write-Error "Lean v2 source directory is missing before exclusion: $relativePath"
              exit 1
            }
            Remove-Item $targetPath -Recurse -Force
          }

          $requiredFiles = @(
            "VPet-Simulator.Windows.exe",
            "VPet-Simulator.Windows.dll",
            "VPet-Simulator.Core.dll",
            "VPet-Simulator.Windows.Interface.dll",
            "VPet-Simulator.Windows.deps.json",
            "VPet-Simulator.Windows.runtimeconfig.json",
            "SkiaSharp.dll",
            "runtimes/win-x64/native/libSkiaSharp.dll",
            "mod/0000_core/info.lps",
            "mod/0000_core/pet/cat.lps",
            "LICENSE"
          )
          foreach ($relativePath in $requiredFiles) {
            if (-not (Test-Path (Join-Path $leanV2Root $relativePath) -PathType Leaf)) {
              Write-Error "Lean v2 package is missing required file: $relativePath"
              exit 1
            }
          }

          $catRoot = Join-Path $leanV2Root "mod/0000_core/pet/cat"
          if (-not (Test-Path $catRoot -PathType Container)) {
            Write-Error "Lean v2 package is missing the cat resource directory."
            exit 1
          }
          $catPngFiles = @(Get-ChildItem $catRoot -Recurse -File -Filter *.png)
          if ($catPngFiles.Count -ne 12) {
            Write-Error "Expected 12 cat PNG files in lean v2 package, found $($catPngFiles.Count)."
            exit 1
          }

          $excludedPaths = @(
            "runtimes/osx",
            "runtimes/osx/native/libSkiaSharp.dylib",
            "runtimes/win-arm64",
            "runtimes/win-arm64/native/libSkiaSharp.dll",
            "runtimes/win-x86",
            "runtimes/win-x86/native/libSkiaSharp.dll",
            "mod/0000_core/pet/vup",
            "mod/0000_core/file"
          )
          foreach ($relativePath in $excludedPaths) {
            if (Test-Path (Join-Path $leanV2Root $relativePath)) {
              Write-Error "Lean v2 package still contains excluded path: $relativePath"
              exit 1
            }
          }
          $galleryArchives = @(Get-ChildItem (Join-Path $leanV2Root "mod/0000_core") -Recurse -File -Filter *.zlps |
            Where-Object { $_.FullName -match '[\\/]file[\\/]' })
          if ($galleryArchives.Count -ne 0) {
            Write-Error "Lean v2 package still contains gallery .zlps archives."
            exit 1
          }

          $fullStats = Get-PackageStats $fullPackageRoot
          $leanV1Stats = Get-PackageStats $leanV1Root
          $leanV2Stats = Get-PackageStats $leanV2Root
          $reducedFiles = $leanV1Stats.FileCount - $leanV2Stats.FileCount
          $reducedBytes = $leanV1Stats.Bytes - $leanV2Stats.Bytes
          $reducedPercent = if ($leanV1Stats.Bytes -eq 0) { 0 } else { ($reducedBytes / $leanV1Stats.Bytes) * 100 }

          if ($leanV2Stats.Bytes -ge $leanV1Stats.Bytes) {
            Write-Error "Lean v2 must be smaller than lean v1."
            exit 1
          }
          if ($reducedBytes -le 30000000 -or $reducedBytes -ge 33000000) {
            Write-Error "Lean v2 reduction is outside the expected range: $reducedBytes bytes."
            exit 1
          }

          $leanV1Inventory = Get-PackageInventory $leanV1Root
          $leanV2Inventory = Get-PackageInventory $leanV2Root
          $allowedRemovedPrefixes = @("runtimes/osx/", "runtimes/win-arm64/", "runtimes/win-x86/")
          $removedFiles = New-Object System.Collections.Generic.List[string]
          $unexpectedDifferences = New-Object System.Collections.Generic.List[string]

          foreach ($relativePath in $leanV1Inventory.Keys) {
            if (-not $leanV2Inventory.ContainsKey($relativePath)) {
              $isAllowedRemoval = @($allowedRemovedPrefixes | Where-Object {
                $relativePath.StartsWith($_, [StringComparison]::OrdinalIgnoreCase)
              }).Count -gt 0
              if ($isAllowedRemoval) {
                $removedFiles.Add($relativePath)
              }
              else {
                $unexpectedDifferences.Add("removed: $relativePath")
              }
              continue
            }

            $v1File = $leanV1Inventory[$relativePath]
            $v2File = $leanV2Inventory[$relativePath]
            if ($v1File.Length -ne $v2File.Length -or $v1File.Sha256 -ne $v2File.Sha256) {
              $unexpectedDifferences.Add("modified: $relativePath")
            }
          }
          foreach ($relativePath in $leanV2Inventory.Keys) {
            if (-not $leanV1Inventory.ContainsKey($relativePath)) {
              $unexpectedDifferences.Add("added: $relativePath")
            }
          }

          if ($removedFiles.Count -eq 0) {
            Write-Error "Lean v2 did not remove any files."
            exit 1
          }
          if ($unexpectedDifferences.Count -ne 0) {
            $unexpectedDifferences | ForEach-Object { Write-Error $_ }
            exit 1
          }

          $catBytes = [long](($catPngFiles | Measure-Object -Property Length -Sum).Sum)
          $x64SkiaPath = Join-Path $leanV2Root "runtimes/win-x64/native/libSkiaSharp.dll"
          $x64SkiaSize = (Get-Item $x64SkiaPath).Length
          $largestFiles = @(Get-ChildItem $leanV2Root -Recurse -File -Force |
            Sort-Object Length -Descending |
            Select-Object -First 30)
          $topLevelStats = @(Get-ChildItem $leanV2Root -Force | ForEach-Object {
            if ($_.PSIsContainer) {
              $files = @(Get-ChildItem $_.FullName -Recurse -File -Force)
              $bytes = [long](($files | Measure-Object -Property Length -Sum).Sum)
              [PSCustomObject]@{ Name = $_.Name; FileCount = $files.Count; Bytes = $bytes }
            }
            else {
              [PSCustomObject]@{ Name = $_.Name; FileCount = 1; Bytes = [long]$_.Length }
            }
          } | Sort-Object Bytes -Descending)

          @(
            "commit_sha=$env:GITHUB_SHA",
            "build_time_utc=$([DateTime]::UtcNow.ToString('o'))",
            "full_file_count=$($fullStats.FileCount)",
            "full_total_bytes=$($fullStats.Bytes)",
            "lean_v1_file_count=$($leanV1Stats.FileCount)",
            "lean_v1_total_bytes=$($leanV1Stats.Bytes)",
            "lean_v2_file_count=$($leanV2Stats.FileCount)",
            "lean_v2_total_bytes=$($leanV2Stats.Bytes)",
            "reduced_file_count=$reducedFiles",
            "reduced_bytes=$reducedBytes",
            "reduced_percent=$($reducedPercent.ToString('F2'))",
            "excluded=runtimes/osx",
            "excluded=runtimes/win-arm64",
            "excluded=runtimes/win-x86",
            "win_x64_skia_path=runtimes/win-x64/native/libSkiaSharp.dll",
            "win_x64_skia_bytes=$x64SkiaSize",
            "cat_png_count=$($catPngFiles.Count)",
            "cat_png_total_bytes=$catBytes",
            "license_exists=True",
            "full_package_regression_check=Passed",
            "lean_v1_regression_check=Passed",
            "lean_v2_required_files_check=Passed",
            "lean_v2_excluded_paths_check=Passed",
            "single_variable_sha256_check=Passed",
            "size_sanity_check=Passed",
            "",
            "largest_30_files:"
          ) | Set-Content $manifestPath

          $leanV2RootPath = (Resolve-Path $leanV2Root).Path
          foreach ($file in $largestFiles) {
            $relativePath = $file.FullName.Substring($leanV2RootPath.Length + 1).Replace('\', '/')
            "$relativePath`t$($file.Length)" | Add-Content $manifestPath
          }

          "" | Add-Content $manifestPath
          "top_level_stats:" | Add-Content $manifestPath
          foreach ($entry in $topLevelStats) {
            "$($entry.Name)`t$($entry.FileCount)`t$($entry.Bytes)" | Add-Content $manifestPath
          }

          "" | Add-Content $manifestPath
          "lean_v1_to_v2_removed_files:" | Add-Content $manifestPath
          foreach ($relativePath in ($removedFiles | Sort-Object)) {
            "$relativePath`t$($leanV1Inventory[$relativePath].Length)`t$($leanV1Inventory[$relativePath].Sha256)" | Add-Content $manifestPath
          }

          @"
          ## Standalone cat lean v2 x64-only test package

          | Metric | Value |
          | --- | ---: |
          | Commit | $env:GITHUB_SHA |
          | Full package files | $($fullStats.FileCount) |
          | Full package bytes | $($fullStats.Bytes) |
          | Lean v1 files | $($leanV1Stats.FileCount) |
          | Lean v1 bytes | $($leanV1Stats.Bytes) |
          | Lean v2 files | $($leanV2Stats.FileCount) |
          | Lean v2 bytes | $($leanV2Stats.Bytes) |
          | Files removed from v1 | $reducedFiles |
          | Bytes removed from v1 | $reducedBytes |
          | Reduction from v1 | $($reducedPercent.ToString('F2'))% |
          | win-x64 libSkiaSharp bytes | $x64SkiaSize |
          | Cat PNG files | $($catPngFiles.Count) |
          | Cat PNG bytes | $catBytes |
          | Single-variable SHA-256 check | Passed |

          Lean v2 additionally excludes only:
          - runtimes/osx
          - runtimes/win-arm64
          - runtimes/win-x86
          "@ | Add-Content $env:GITHUB_STEP_SUMMARY

          Get-Content $manifestPath

      - name: Upload x64-only lean v2 internal Windows test package
        if: github.event_name == 'workflow_dispatch' && inputs.upload_test_package == true && steps.build-windows.outputs.exit_code == '0'
        uses: actions/upload-artifact@v4
        with:
          name: standalone-cat-windows-x64-lean-v2-test
          path: artifacts/standalone-cat-windows-x64-lean-v2-test
          retention-days: 3

      - name: Upload lean v2 package manifest
        if: github.event_name == 'workflow_dispatch' && inputs.upload_test_package == true && steps.build-windows.outputs.exit_code == '0'
        uses: actions/upload-artifact@v4
        with:
          name: standalone-cat-lean-v2-manifest
          path: standalone-cat-lean-v2-manifest.txt
          retention-days: 7

      - name: Fail if Windows build failed
        if: always()
        shell: pwsh
        run: |
          $exitCode = '${{ steps.build-windows.outputs.exit_code }}'
          Write-Host "Captured Windows build exit code: $exitCode"

          if ($exitCode -ne '0') {
            exit 1
          }
